name: CI

# Every pull request and every push to main: the backend (lint, compile, tests, a boot check), the frontend gate, and a check that the
# deployment images still build. No secrets are used.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt ruff
      - name: Lint (unused imports and names, syntax errors)
        run: ruff check --select F,E9 --exclude Frontend,.agent .
      - name: Compile
        run: python -m compileall -q -x '(^|/)(Frontend|\.venv)/' .
      - name: Backend tests
        run: python -m unittest discover -s tests/test_awdax_api -t tests/test_awdax_api
      - name: Backend tests (tests/*.py; test_awdax_api has no __init__.py, so neither run picks up the other)
        run: python -m unittest discover -s tests -t tests -p 'test_*.py'
      - name: Boot check (gunicorn serves /health, /ready and the API description)
        env:
          SQLITE_PATH: ${{ runner.temp }}/boot.sqlite
          PORT: '8000'
        run: |
          gunicorn -c deploy/gunicorn.conf.py app:app &
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs localhost:8000/health
          curl -fs localhost:8000/ready
          curl -fs localhost:8000/api/openapi.json | python -c "import json,sys; d=json.load(sys.stdin); assert d['paths'], 'empty API description'"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/instances)" = "401"  # strict sign-in by default
          kill %1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Type check and build
        run: npm run build

  images:
    # The two images the server runs. Built, not pushed: this proves a deploy would not fail at the build step.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Backend image
        run: docker build -t awdax-api .
      - name: Website image
        run: docker build -f deploy/web.Dockerfile -t awdax-web .
