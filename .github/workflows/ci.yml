name: CI

# Checks only: backend tests and the frontend gate. No secrets, no deploy. (Frontend/.github/workflows/deploy.yml is
# from the frontend's old repo; GitHub reads workflows only from the root .github, so it does not run here.)
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q -x '(^|/)(Frontend|\.venv)/' .
      - name: Backend tests
        run: python -m unittest discover -s tests/test_awdax_api -t tests/test_awdax_api
      - name: Backend tests (tests/*.py; test_awdax_api has no __init__.py, so neither run picks up the other)
        run: python -m unittest discover -s tests -t tests -p 'test_*.py'

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Type check and build
        run: npm run build
