<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Scraper</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; color: #111; }
        .app-shell { display: flex; min-height: 100vh; }
        #sidebar {
            width: 260px; flex-shrink: 0; background: #1a1d21; color: #e8e8e8;
            display: flex; flex-direction: column; border-right: 1px solid #2a2f36;
        }
        .sidebar-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.85rem 0.75rem; border-bottom: 1px solid #2a2f36;
        }
        .sidebar-head strong { font-size: 0.95rem; }
        #btnNewSession {
            background: #2d6cdf; color: #fff; border: none; border-radius: 6px;
            width: 1.75rem; height: 1.75rem; font-size: 1.1rem; line-height: 1;
        }
        #sessionList { list-style: none; margin: 0; padding: 0.35rem 0; overflow-y: auto; flex: 1; }
        .session-item {
            display: flex; align-items: flex-start; gap: 0.45rem;
            padding: 0.55rem 0.75rem; cursor: pointer; border-left: 3px solid transparent;
        }
        .session-item:hover { background: #252930; }
        .session-item.active { background: #2a3140; border-left-color: #5b9aff; }
        .session-meta { flex: 1; min-width: 0; }
        .session-title { font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .session-sub { font-size: 0.72rem; color: #9aa3ad; margin-top: 0.15rem; }
        .session-actions { display: flex; gap: 0.25rem; flex-shrink: 0; }
        .session-item.active .session-actions { opacity: 1; }
        .session-actions button {
            background: transparent; border: none; color: #9aa3ad; cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 0.15rem;
        }
        .session-actions button:hover { color: #f87171; }
        .indicators { display: flex; gap: 0.25rem; margin-top: 0.25rem; }
        .live-dot, .run-dot {
            width: 7px; height: 7px; border-radius: 50%; display: inline-block;
        }
        .live-dot { background: #3dd68c; box-shadow: 0 0 6px #3dd68c; animation: livepulse 1.4s ease-in-out infinite; }
        .run-dot { background: #5b9aff; }
        @keyframes livepulse { 50% { opacity: 0.35; } }
        .main-panel { flex: 1; padding: 1.25rem 1.5rem 2rem; max-width: 980px; }
        h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
        .sub { color: #666; font-size: 0.85rem; margin-bottom: 1rem; }
        textarea { width: 100%; min-height: 72px; font: inherit; padding: 0.5rem; box-sizing: border-box; }
        .bar { display: flex; gap: 0.5rem; align-items: center; margin: 0.5rem 0; flex-wrap: wrap; }
        button { padding: 0.35rem 0.75rem; cursor: pointer; }
        button:disabled { opacity: 0.55; cursor: not-allowed; }
        .status { color: #555; font-size: 0.9rem; }
        .progress { font-size: 0.85rem; color: #333; margin-bottom: 0.5rem; padding: 0.5rem 0.65rem; background: #f5f5f5; border-radius: 6px; }
        .progress.active { background: #eef6ff; border: 1px solid #c5ddf8; }
        .progress.err { background: #fdecea; border: 1px solid #f5c2c0; color: #b00020; }
        .sources { font-size: 0.85rem; margin-bottom: 0.75rem; max-height: 220px; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; padding: 0.5rem; }
        .headers-preview { font-size: 0.9rem; margin-bottom: 0.75rem; padding: 0.65rem; border: 1px solid #c5ddf8; background: #f8fbff; border-radius: 6px; }
        .headers-preview th { text-align: left; padding-right: 1rem; }
        .log { font-family: ui-monospace, monospace; font-size: 0.75rem; max-height: 160px; overflow-y: auto; background: #1e1e1e; color: #d4d4d4; padding: 0.5rem 0.65rem; border-radius: 6px; margin-bottom: 1rem; }
        .log .err { color: #f48771; }
        article { border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 0.75rem; }
        article.new { animation: fadein 0.4s ease; }
        @keyframes fadein { from { background: #fffde7; } to { background: #fff; } }
        .pulse { animation: pulse 1.2s ease-in-out infinite; }
        @keyframes pulse { 50% { opacity: 0.45; } }
        .data-table-wrap { overflow-x: auto; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 8px; }
        table.data-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
        table.data-table th, table.data-table td { border-bottom: 1px solid #eee; padding: 0.45rem 0.65rem; text-align: left; vertical-align: top; }
        table.data-table th { background: #f7f7f7; font-weight: 600; position: sticky; top: 0; }
        table.data-table tr:hover td { background: #fafafa; }
        .live-toggle { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.9rem; cursor: pointer; user-select: none; }
        .live-toggle input { width: 1rem; height: 1rem; }
        .progress.live-on { border-color: #2a7; background: #f0fff4; }
    </style>
</head>
<body>
<div class="app-shell">
    <aside id="sidebar">
        <div class="sidebar-head">
            <strong>Sessions</strong>
            <button type="button" id="btnNewSession" title="New session">+</button>
        </div>
        <ul id="sessionList"></ul>
    </aside>
    <main class="main-panel">
    <h1>Universal Scraper</h1>
    <p class="sub">Prompt → queries → discover → table headers → Gemini scrape → merged catalog.</p>

    <label for="prompt"><strong>What do you want to scrape?</strong></label>
    <textarea id="prompt" placeholder="e.g. List all EV cars in India with prices"></textarea>
    <div class="bar">
        <button type="button" id="btnPlan">1. Understand prompt</button>
        <button type="button" id="btnQueries" disabled>2. Generate queries</button>
        <button type="button" id="btnDiscover" disabled>3. Discover &amp; inspect</button>
        <button type="button" id="btnHeaders" disabled>4. Table headers</button>
        <button type="button" id="btnRun" disabled>5. Run scrape</button>
        <label class="live-toggle" title="Re-scrape on an interval and append new rows automatically">
            <input type="checkbox" id="keepLive" /> Keep it live
        </label>
        <button type="button" id="btnEgazette">Quick eGazette preset</button>
    </div>
    <div id="queries" class="sources" hidden></div>
    <div id="sources" class="sources" hidden></div>
    <div id="headersPreview" class="headers-preview" hidden></div>
    <div class="progress" id="progress">Connecting stream…</div>
    <pre class="log" id="log" aria-live="polite"></pre>

    <div class="bar">
        <button type="button" id="refresh">Refresh feed</button>
        <button type="button" id="scrapeLegacy">Legacy eGazette scrape</button>
        <span class="status" id="status">Loading…</span>
    </div>
    <div id="feed"></div>
    </main>
</div>

    <script>
        const SESSION_KEY = "universal_scraper_session_id";
        const statusEl = document.getElementById("status");
        const feedEl = document.getElementById("feed");
        const progressEl = document.getElementById("progress");
        const logEl = document.getElementById("log");
        const queriesEl = document.getElementById("queries");
        const sourcesEl = document.getElementById("sources");
        const headersPreviewEl = document.getElementById("headersPreview");
        const itemsById = new Map();
        let eventSource = null;
        let lastSources = [];
        let tableSchema = null;
        let activeSessionId = null;
        let currentJobId = null;
        let sessionsCache = [];
        const liveJobIds = new Set();
        const runningJobIds = new Set();

        function esc(s) {
            const d = document.createElement("div");
            d.textContent = s ?? "";
            return d.innerHTML;
        }

        function appendLog(level, message) {
            const line = document.createElement("div");
            if (level === "error") line.className = "err";
            line.textContent = new Date().toLocaleTimeString() + " " + message;
            logEl.appendChild(line);
            while (logEl.childNodes.length > 100) logEl.removeChild(logEl.firstChild);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function sessionHeaders() {
            const h = { "Content-Type": "application/json" };
            if (activeSessionId) h["X-Session-Id"] = activeSessionId;
            return h;
        }

        function withSession(body) {
            const o = body && typeof body === "object" ? Object.assign({}, body) : {};
            if (activeSessionId) o.session_id = activeSessionId;
            return o;
        }

        async function apiFetch(path, opts) {
            opts = opts || {};
            const headers = Object.assign({}, sessionHeaders(), opts.headers || {});
            if (opts.body && typeof opts.body === "object" && !(opts.body instanceof FormData)) {
                opts.body = JSON.stringify(withSession(opts.body));
            } else if (opts.body === undefined && (opts.method === "POST" || opts.method === "PATCH")) {
                opts.body = JSON.stringify(withSession({}));
            }
            opts.headers = headers;
            return fetch(path, opts);
        }

        function applyOverview(overview) {
            liveJobIds.clear();
            runningJobIds.clear();
            (overview.live_job_ids || []).forEach(function (id) { liveJobIds.add(id); });
            (overview.running_job_ids || []).forEach(function (id) { runningJobIds.add(id); });
            renderSessionList();
        }

        let sessionUsesRegulatoryFeed = false;

        function isActiveJob(msgJobId) {
            if (sessionUsesRegulatoryFeed && !msgJobId) return true;
            if (!msgJobId) return false;
            if (!currentJobId) return false;
            return msgJobId === currentJobId;
        }

        function activeSessionMeta() {
            return sessionsCache.find(function (s) { return s.id === activeSessionId; }) || {};
        }

        function sessionWantsLive(sess) {
            sess = sess || activeSessionMeta();
            return !!(sess && sess.keep_live);
        }

        function syncKeepLiveCheckbox(sess, serverLive) {
            const el = document.getElementById("keepLive");
            if (!el) return;
            const jid = (sess && sess.job_id) || currentJobId;
            const runningLive = serverLive != null
                ? serverLive
                : (jid && liveJobIds.has(jid));
            const want = sess ? !!sess.keep_live : sessionWantsLive();
            el.checked = runningLive || want;
        }

        function resetFeedPanel(message) {
            itemsById.clear();
            feedEl.innerHTML = "<p class=\"status\">" + esc(message || "No data for this session yet.") + "</p>";
            statusEl.textContent = "0 rows (this session)";
        }

        function resetProgressPanel() {
            progressEl.textContent = "Idle";
            progressEl.classList.remove("active", "pulse", "live-on", "err");
        }

        async function persistActiveSessionUI() {
            if (!activeSessionId) return;
            try {
                await apiFetch("/api/sessions/" + encodeURIComponent(activeSessionId), {
                    method: "PATCH",
                    body: { prompt_draft: document.getElementById("prompt").value },
                });
            } catch (_) { /* ignore */ }
        }

        function applyStatus(msg) {
            const st = msg.channel === "universal" ? msg : msg;
            if (sessionUsesRegulatoryFeed && !st.job_id && st.channel !== "universal") {
                const running = !!st.is_running;
                progressEl.classList.toggle("active", running);
                progressEl.classList.toggle("pulse", running);
                progressEl.classList.toggle("err", st.phase === "error" || st.last_error);
                const count = st.gazette_count ?? st.rows_this_run;
                progressEl.textContent = [
                    st.phase && st.phase !== "idle" ? "Phase: " + st.phase : null,
                    st.message,
                    count != null ? "Count: " + count : null,
                    st.last_error ? "Error: " + st.last_error : null,
                ].filter(Boolean).join(" · ") || "Idle";
                return;
            }
            if (st.job_id) {
                if (st.live_enabled) liveJobIds.add(st.job_id);
                else liveJobIds.delete(st.job_id);
                if (st.is_running) runningJobIds.add(st.job_id);
                else runningJobIds.delete(st.job_id);
                renderSessionList();
            }
            if (!isActiveJob(st.job_id)) return;
            const running = !!st.is_running;
            const liveOn = (currentJobId && liveJobIds.has(currentJobId)) || sessionWantsLive();
            syncKeepLiveCheckbox(activeSessionMeta(), currentJobId && liveJobIds.has(currentJobId));
            progressEl.classList.toggle("active", running || liveOn);
            progressEl.classList.toggle("pulse", running);
            progressEl.classList.toggle("live-on", liveOn);
            progressEl.classList.toggle("err", st.phase === "error" || st.last_error);
            const count = st.record_count ?? st.gazette_count ?? st.rows_this_run;
            progressEl.textContent = [
                liveOn ? "Live" : null,
                st.phase && st.phase !== "idle" ? "Phase: " + st.phase : null,
                st.message,
                count != null ? "Count: " + count : null,
                st.last_error ? "Error: " + st.last_error : null,
            ].filter(Boolean).join(" · ") || "Idle";
        }

        function renderSessionList() {
            const list = document.getElementById("sessionList");
            if (!sessionsCache.length) {
                list.innerHTML = "<li class=\"session-sub\" style=\"padding:0.75rem\">No sessions</li>";
                return;
            }
            list.innerHTML = sessionsCache.map(function (s) {
                const live = s.job_id && liveJobIds.has(s.job_id);
                const run = s.job_id && runningJobIds.has(s.job_id);
                const ind = (live ? "<span class=\"live-dot\" title=\"Live\"></span>" : "") +
                    (run ? "<span class=\"run-dot\" title=\"Running\"></span>" : "");
                return (
                    "<li class=\"session-item" + (s.id === activeSessionId ? " active" : "") + "\" data-id=\"" + esc(s.id) + "\">" +
                    "<div class=\"session-meta\">" +
                    "<div class=\"session-title\">" + esc(s.title || "Untitled") + "</div>" +
                    "<div class=\"session-sub\">" + (s.job_id ? esc(s.job_id.slice(0, 8)) : "no job") + "</div>" +
                    (ind ? "<div class=\"indicators\">" + ind + "</div>" : "") +
                    "</div>" +
                    "<div class=\"session-actions\">" +
                    "<button type=\"button\" data-del=\"" + esc(s.id) + "\" title=\"Delete\">×</button>" +
                    "</div></li>"
                );
            }).join("");
            list.querySelectorAll(".session-item").forEach(function (el) {
                el.onclick = function (ev) {
                    if (ev.target.closest("[data-del]")) return;
                    switchSession(el.getAttribute("data-id"));
                };
            });
            list.querySelectorAll("[data-del]").forEach(function (btn) {
                btn.onclick = async function (ev) {
                    ev.stopPropagation();
                    const id = btn.getAttribute("data-del");
                    if (!confirm("Delete this session? Live scrape for it will stop.")) return;
                    const res = await fetch("/api/sessions/" + encodeURIComponent(id), { method: "DELETE" });
                    const data = await res.json();
                    if (!data.ok) return appendLog("error", data.error);
                    await refreshSessionsList();
                    if (id === activeSessionId && data.active_session) {
                        await switchSession(data.active_session.id, data.active_session);
                    }
                };
            });
        }

        async function refreshSessionsList() {
            const res = await fetch("/api/sessions");
            const data = await res.json();
            if (!data.ok) throw new Error(data.error);
            sessionsCache = data.sessions || [];
            applyOverview(data);
        }

        function hydrateUIFromSession(sess) {
            const promptEl = document.getElementById("prompt");
            const intent = sess.intent || {};
            sessionUsesRegulatoryFeed = intent.pipeline === "regulatory_feed";
            promptEl.value = intent.raw_prompt || sess.prompt_draft || intent.topic || "";
            currentJobId = sess.job_id || (intent.job_id || null);
            tableSchema = sess.table_schema || null;
            lastSources = sess.sources || [];
            if (sess.search_queries && sess.search_queries.length) {
                queriesEl.hidden = false;
                queriesEl.innerHTML = "<strong>Search queries</strong>" + sess.search_queries.map(function (q, i) {
                    return "<div>#" + (i + 1) + " " + esc(q.query || q) + "</div>";
                }).join("");
            } else {
                queriesEl.hidden = true;
                queriesEl.innerHTML = "";
            }
            if (lastSources.length) {
                renderInspectedSources(lastSources, null);
            } else {
                sourcesEl.hidden = true;
                sourcesEl.innerHTML = "";
            }
            renderHeadersPreview(sess.table_schema);
            document.getElementById("btnQueries").disabled = !sess.intent;
            document.getElementById("btnDiscover").disabled = !(sess.search_queries && sess.search_queries.length);
            document.getElementById("btnHeaders").disabled = !(sess.plans && sess.plans.length);
            document.getElementById("btnRun").disabled = !(sess.table_schema && sess.plans && sess.plans.length);
            syncKeepLiveCheckbox(sess);
            if (!currentJobId) resetProgressPanel();
        }

        async function maybeResumeLive(sess, serverLive) {
            if (!sess || !sess.keep_live || !sess.job_id) return;
            if (serverLive || liveJobIds.has(sess.job_id)) {
                syncKeepLiveCheckbox(sess, true);
                return;
            }
            if (!sess.table_schema || !sess.plans || !sess.plans.length) return;
            appendLog("info", "Restoring live scrape for this session…");
            const res = await apiFetch("/api/scrape/run", { method: "POST", body: { live: true } });
            const data = await res.json();
            if (data.ok && data.started && data.job_id) {
                liveJobIds.add(data.job_id);
                syncKeepLiveCheckbox(Object.assign({}, sess, { keep_live: true }), true);
                renderSessionList();
                appendLog("info", data.message || "Live scrape resumed");
            } else if (!data.ok) {
                appendLog("error", data.error || "Could not resume live scrape");
            }
        }

        async function switchSession(sessionId, prefetched) {
            if (!sessionId) return;
            if (activeSessionId && activeSessionId !== sessionId) {
                await persistActiveSessionUI();
            }
            activeSessionId = sessionId;
            localStorage.setItem(SESSION_KEY, sessionId);
            resetFeedPanel("Loading session…");
            let jobStatus = null;
            let serverLive = false;
            const res = await fetch("/api/sessions/" + encodeURIComponent(sessionId));
            const data = await res.json();
            if (!data.ok) throw new Error(data.error);
            serverLive = !!data.live;
            if (data.live && data.session && data.session.job_id) liveJobIds.add(data.session.job_id);
            if (data.running && data.session && data.session.job_id) runningJobIds.add(data.session.job_id);
            const sess = data.session || prefetched;
            jobStatus = data.status;
            const row = sessionsCache.find(function (s) { return s.id === sessionId; });
            if (row && sess) {
                row.keep_live = !!sess.keep_live;
                row.job_id = sess.job_id;
            }
            hydrateUIFromSession(sess);
            syncKeepLiveCheckbox(sess, serverLive);
            renderSessionList();
            logEl.innerHTML = "";
            appendLog("info", "Switched to: " + (sess.title || sessionId));
            if (jobStatus && jobStatus.job_id === sess.job_id) applyStatus(jobStatus);
            else if (!sess.job_id) resetProgressPanel();
            await loadFeed();
            await maybeResumeLive(sess, serverLive);
        }

        async function initSessions() {
            await refreshSessionsList();
            let sid = localStorage.getItem(SESSION_KEY);
            if (!sid || !sessionsCache.some(function (s) { return s.id === sid; })) {
                sid = sessionsCache[0] && sessionsCache[0].id;
            }
            if (!sid) {
                const res = await apiFetch("/api/sessions", { method: "POST", body: {} });
                const data = await res.json();
                if (data.ok && data.session) sid = data.session.id;
                await refreshSessionsList();
            }
            if (sid) await switchSession(sid);
        }

        function renderHeadersPreview(schema) {
            if (!schema || !schema.columns) {
                headersPreviewEl.hidden = true;
                return;
            }
            tableSchema = schema;
            headersPreviewEl.hidden = false;
            const labels = schema.column_labels || schema.columns;
            let html = "<strong>Output table columns</strong>";
            if (schema.description) html += "<p class=\"sub\">" + esc(schema.description) + "</p>";
            html += "<table><tr>";
            schema.columns.forEach(function (col, i) {
                html += "<th>" + esc(labels[i] || col) + " <small>(" + esc(col) + ")</small></th>";
            });
            html += "</tr></table>";
            headersPreviewEl.innerHTML = html;
        }

        function itemHtml(it, isNew) {
            const title = it.topic || it.subject || it.gazette_id || it.external_id || "Untitled";
            const pdf = it.pdf_url ? "<a href=\"" + esc(it.pdf_url) + "\" target=\"_blank\">PDF</a> · " : "";
            return (
                "<article class=\"" + (isNew ? "new" : "") + "\" data-id=\"" + esc(String(it.id)) + "\">" +
                "<h2>" + esc(title) + "</h2>" +
                "<div class=\"meta\">" + pdf + esc(it.gazette_id || it.external_id || "") + "</div>" +
                "<p>" + esc(it.summary || "Saved — summary optional") + "</p></article>"
            );
        }

        function upsertItem(it, isNew) {
            if (!it || it.id == null) return;
            itemsById.set(it.id, it);
            const sel = "[data-id=\"" + CSS.escape(String(it.id)) + "\"]";
            const existing = feedEl.querySelector(sel);
            const html = itemHtml(it, isNew);
            if (existing) existing.outerHTML = html;
            else {
                if (feedEl.querySelector(".status")) feedEl.innerHTML = "";
                feedEl.insertAdjacentHTML("afterbegin", html);
            }
            statusEl.textContent = itemsById.size + " item(s)";
        }

        function tableHtml(columns, labels, rows) {
            const heads = (labels && labels.length) ? labels : columns.map(function (c) {
                return c.replace(/_/g, " ").replace(/\b\w/g, function (m) { return m.toUpperCase(); });
            });
            let h = "<div class=\"data-table-wrap\"><table class=\"data-table\"><thead><tr>";
            heads.forEach(function (lab) { h += "<th>" + esc(lab) + "</th>"; });
            h += "</tr></thead><tbody>";
            rows.forEach(function (row) {
                h += "<tr>";
                columns.forEach(function (col) {
                    h += "<td>" + esc(row[col] || "") + "</td>";
                });
                h += "</tr>";
            });
            h += "</tbody></table></div>";
            return h;
        }

        function renderTablePayload(data) {
            feedEl.innerHTML = tableHtml(data.columns, data.column_labels, data.rows);
            statusEl.textContent = data.count + " row(s) in merged table (" + (data.source || "universal") + ")";
        }

        async function loadFeed() {
            if (!activeSessionId) return;
            let url = "/api/feed?session_id=" + encodeURIComponent(activeSessionId);
            if (currentJobId) url += "&job_id=" + encodeURIComponent(currentJobId);
            const res = await fetch(url);
            const data = await res.json();
            if (!data.ok) throw new Error(data.error);
            itemsById.clear();
            if (data.view === "empty" || data.session_scoped && !data.count) {
                resetFeedPanel("No data yet for this session. Run the pipeline steps to scrape.");
                return;
            }
            if (data.view === "table" && data.rows && data.rows.length) {
                renderTablePayload(data);
                return;
            }
            if (!data.items || !data.items.length) {
                resetFeedPanel("No records yet for this session. Run scrape to fill the table.");
                return;
            }
            if (data.source === "regulatory" && data.pipeline !== "regulatory_feed") {
                resetFeedPanel("No universal scrape data in this session.");
                return;
            }
            feedEl.innerHTML = data.items.map(function (it) {
                itemsById.set(it.id, it);
                return itemHtml(it, false);
            }).join("");
            statusEl.textContent = data.count + " item(s)" +
                (data.pipeline === "regulatory_feed" ? " (RegulatoryFeed)" : " (this session)");
        }

        function connectStream() {
            if (eventSource) eventSource.close();
            eventSource = new EventSource("/api/events");
            eventSource.onmessage = function (ev) {
                let msg;
                try { msg = JSON.parse(ev.data); } catch { return; }
                if (msg.type === "connected") {
                    applyOverview(msg);
                    applyStatus(msg.universal || msg);
                    syncKeepLiveCheckbox(
                        activeSessionMeta(),
                        currentJobId && liveJobIds.has(currentJobId)
                    );
                } else if (msg.type === "jobs_overview") {
                    applyOverview(msg);
                    syncKeepLiveCheckbox(
                        activeSessionMeta(),
                        currentJobId && liveJobIds.has(currentJobId)
                    );
                } else if (msg.type === "status") {
                    applyStatus(msg);
                } else if (msg.type === "log") {
                    if (sessionUsesRegulatoryFeed && !msg.job_id && msg.channel !== "universal") {
                        appendLog(msg.level || "info", msg.message || "");
                        return;
                    }
                    if (!isActiveJob(msg.job_id)) return;
                    appendLog(msg.level || "info", (msg.channel ? msg.channel + ": " : "") + (msg.message || ""));
                } else if (msg.type === "item" && msg.item) {
                    if (sessionUsesRegulatoryFeed && !msg.job_id && !msg.item.job_id) {
                        upsertItem(msg.item, !msg.update);
                        return;
                    }
                    if (!isActiveJob(msg.job_id || msg.item.job_id)) return;
                    upsertItem(msg.item, !msg.update);
                } else if (msg.type === "table" && msg.table) {
                    if (!isActiveJob(msg.job_id)) return;
                    renderTablePayload({
                        columns: msg.table.columns,
                        column_labels: msg.table.column_labels,
                        rows: msg.table.rows,
                        count: msg.table.row_count,
                        source: "universal",
                    });
                    let tlog = "Merged table updated: " + (msg.table.row_count || 0) + " rows";
                    if (msg.new_row_count) tlog += " (+" + msg.new_row_count + " new)";
                    appendLog("info", tlog);
                }
            };
        }

        document.getElementById("keepLive").addEventListener("change", async function (ev) {
            if (ev.target.checked) {
                try {
                    const row = activeSessionMeta();
                    if (row) row.keep_live = true;
                    await apiFetch("/api/sessions/" + encodeURIComponent(activeSessionId), {
                        method: "PATCH",
                        body: { keep_live: true },
                    });
                } catch (e) {
                    appendLog("error", e.message);
                }
                return;
            }
            try {
                const res = await apiFetch("/api/scrape/live/stop", {
                    method: "POST",
                    body: { job_id: currentJobId },
                });
                const data = await res.json();
                if (data.ok) {
                    if (currentJobId) liveJobIds.delete(currentJobId);
                    const row = activeSessionMeta();
                    if (row) row.keep_live = false;
                    await apiFetch("/api/sessions/" + encodeURIComponent(activeSessionId), {
                        method: "PATCH",
                        body: { keep_live: false },
                    });
                    syncKeepLiveCheckbox({ keep_live: false, job_id: currentJobId }, false);
                    renderSessionList();
                    appendLog("info", "Live mode stopped");
                } else appendLog("error", data.error || "Could not stop live mode");
            } catch (e) {
                appendLog("error", e.message);
            }
        });

        document.getElementById("btnNewSession").onclick = async function () {
            const res = await apiFetch("/api/sessions", { method: "POST", body: { title: "New session" } });
            const data = await res.json();
            if (!data.ok) return appendLog("error", data.error);
            await refreshSessionsList();
            await switchSession(data.session.id, data.session);
        };

        document.getElementById("btnPlan").onclick = async function () {
            const prompt = document.getElementById("prompt").value.trim();
            if (!prompt) return alert("Enter a prompt");
            appendLog("info", "Parsing prompt…");
            const res = await apiFetch("/api/prompt", { method: "POST", body: { prompt: prompt } });
            const data = await res.json();
            if (!data.ok) return appendLog("error", data.error);
            if (data.session) {
                currentJobId = data.session.job_id;
                const row = sessionsCache.find(function (s) { return s.id === activeSessionId; });
                if (row) {
                    row.title = data.session.title;
                    row.job_id = data.session.job_id;
                    row.has_intent = true;
                }
                renderSessionList();
            }
            appendLog("info", "Intent: " + data.intent.topic);
            sessionUsesRegulatoryFeed = data.intent.pipeline === "regulatory_feed";
            if (sessionUsesRegulatoryFeed) {
                appendLog("info", "RegulatoryFeed mode — official eGazette (PDF + AI summaries), same as Legacy scrape.");
            }
            document.getElementById("btnQueries").disabled = false;
            document.getElementById("btnDiscover").disabled = true;
            document.getElementById("btnHeaders").disabled = true;
            document.getElementById("btnRun").disabled = true;
            queriesEl.hidden = true;
            sourcesEl.hidden = true;
            headersPreviewEl.hidden = true;
        };

        document.getElementById("btnQueries").onclick = async function () {
            const btn = document.getElementById("btnQueries");
            btn.disabled = true;
            appendLog("info", "Generating 10 Google search queries…");
            const res = await apiFetch("/api/queries", { method: "POST", body: {} });
            const data = await res.json();
            btn.disabled = false;
            if (!data.ok) return appendLog("error", data.error);
            queriesEl.hidden = false;
            queriesEl.innerHTML = "<strong>Search queries</strong>" + (data.queries || []).map(function (q, i) {
                return "<div>#" + (i + 1) + " " + esc(q.query || q) + "</div>";
            }).join("");
            appendLog("info", "Generated " + data.count + " queries");
            document.getElementById("btnDiscover").disabled = false;
        };

        function renderInspectedSources(sources, inspected) {
            const byUrl = {};
            (inspected || []).forEach(function (row, i) {
                byUrl[row.url] = row;
            });
            sourcesEl.hidden = false;
            sourcesEl.innerHTML = sources.map(function (s, i) {
                const row = inspected && inspected[i] ? inspected[i] : byUrl[s.url] || {};
                const https = s.https_ok ? "HTTPS ✓" : "HTTPS ✗";
                const cat = s.source_category ? ("[" + esc(s.source_category) + "] ") : "";
                const dry = row.dry_run_rows != null ? (" · dry-run " + row.dry_run_rows + " rows") : "";
                const conf = row.confidence != null ? (" · conf " + Number(row.confidence).toFixed(2)) : "";
                const blocked = row.blocked ? " · BLOCKED" : "";
                const q = s.search_query ? ("<br><small>Query: " + esc(s.search_query) + "</small>") : "";
                return "<div><strong>#" + (i + 1) + "</strong> " + https + " " + cat + esc(s.title || row.source || s.url) + dry + conf + blocked + "<br><small>" + esc(s.url) + "</small>" + q + "</div>";
            }).join("");
        }

        document.getElementById("btnDiscover").onclick = async function () {
            const btn = document.getElementById("btnDiscover");
            btn.disabled = true;
            appendLog("info", "Gemini source search + inspect per query…");
            progressEl.classList.add("active", "pulse");
            progressEl.textContent = "Source search + inspect…";
            const res = await apiFetch("/api/discover", { method: "POST", body: {} });
            const data = await res.json();
            btn.disabled = false;
            progressEl.classList.remove("pulse");
            if (!data.ok) return appendLog("error", data.error);
            lastSources = data.sources || [];
            renderInspectedSources(lastSources, data.inspected);
            (data.inspected || []).forEach(function (s) {
                appendLog("info", (s.source || s.url) + " — dry-run " + s.dry_run_rows + " rows, conf " + s.confidence);
            });
            appendLog("info", "Ready: " + data.count + " inspected sites (target " + (data.target || 10) + ")");
            document.getElementById("btnHeaders").disabled = data.count === 0;
            document.getElementById("btnRun").disabled = true;
        };

        document.getElementById("btnHeaders").onclick = async function () {
            appendLog("info", "Proposing merged table headers…");
            const res = await apiFetch("/api/table-headers", { method: "POST", body: {} });
            const data = await res.json();
            if (!data.ok) return appendLog("error", data.error);
            renderHeadersPreview(data.table_schema);
            appendLog("info", "Columns: " + (data.table_schema.columns || []).join(", "));
            document.getElementById("btnRun").disabled = false;
        };

        document.getElementById("btnRun").onclick = async function () {
            const live = document.getElementById("keepLive").checked;
            appendLog("info", live ? "Starting live scrape (watching for new data)…" : "Starting scrape on ALL inspected sources…");
            const res = await apiFetch("/api/scrape/run", { method: "POST", body: { live: live } });
            const data = await res.json();
            if (!data.ok) appendLog("error", data.error);
            else {
                appendLog("info", data.message || "Started job " + (data.job_id || ""));
                if (data.job_id) {
                    currentJobId = data.job_id;
                    if (live && data.started) liveJobIds.add(data.job_id);
                }
                if (data.session) {
                    const row = sessionsCache.find(function (s) { return s.id === activeSessionId; });
                    if (row) {
                        row.keep_live = !!data.session.keep_live;
                        row.job_id = data.session.job_id;
                    }
                    syncKeepLiveCheckbox(data.session, live && data.started);
                } else if (live && data.started) {
                    const row = activeSessionMeta();
                    if (row) row.keep_live = true;
                    syncKeepLiveCheckbox({ keep_live: true, job_id: currentJobId }, true);
                }
                if (live && !data.started) syncKeepLiveCheckbox({ keep_live: false }, false);
                renderSessionList();
            }
        };

        document.getElementById("btnEgazette").onclick = async function () {
            document.getElementById("prompt").value = document.getElementById("prompt").value || "Indian eGazette notifications";
            await apiFetch("/api/prompt", { method: "POST", body: { prompt: document.getElementById("prompt").value } });
            appendLog("info", "Running eGazette preset plan…");
            const res = await apiFetch("/api/scrape/run", { method: "POST", body: { use_egazette_preset: true } });
            const data = await res.json();
            if (!data.ok) appendLog("error", data.error);
            else appendLog("info", "Preset scrape started");
            document.getElementById("btnRun").disabled = false;
        };

        document.getElementById("refresh").onclick = function () { loadFeed().catch(function (e) { appendLog("error", e.message); }); };
        document.getElementById("scrapeLegacy").onclick = async function () {
            appendLog("info", "Legacy RegulatoryFeed scrape…");
            await fetch("/api/scrape/start", { method: "POST" });
        };

        document.getElementById("prompt").addEventListener("blur", function () {
            persistActiveSessionUI().catch(function () {});
        });

        connectStream();
        initSessions().catch(function (e) { appendLog("error", e.message); });
    </script>
</body>
</html>
