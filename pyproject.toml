[project]
name = "awdax"
version = "0.0.1"
description = "Autonomous Web Data Acquisition & eXtraction"
readme = "Readme.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
